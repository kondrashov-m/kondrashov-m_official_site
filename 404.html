            .preloader {
                position: fixed;      /* Фиксированное позиционирование поверх всего */
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #000;     /* Черный фон */

    <script>
    // Функция для установки активной ссылки в навигации
    function setActiveNavLink() {
        const currentPath = window.location.pathname.split('/').pop() || 'berloga.html';
        const navLinks = document.querySelectorAll('#header-nav .nav-link');
        
        navLinks.forEach(link => {
            link.classList.remove('active');
            const href = link.getAttribute('href');
            if (href === currentPath) {
                link.classList.add('active');
            }
        });
    }

    // Загрузка header и footer
    document.addEventListener('DOMContentLoaded', function() {
        // Инициализация AOS
        AOS.init({
            duration: 1500,
            once: true,
            offset: 100
        });

        // Загрузка header
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                setTimeout(setActiveNavLink, 100);
            })
            .catch(error => console.error('Error loading header:', error));

        // Загрузка footer
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
                // Обновляем AOS после загрузки футера
                setTimeout(function() {
                    AOS.refresh();
                }, 200);
            })
            .catch(error => console.error('Error loading footer:', error));
    });

    // Функция для стрелки вверх
    const scrollToTopBtn = document.getElementById('scrollToTop');

    window.addEventListener('scroll', function() {
        if (window.pageYOffset > 300) {
            scrollToTopBtn.classList.add('active');
        } else {
            scrollToTopBtn.classList.remove('active');
        }
    });

    scrollToTopBtn.addEventListener('click', function() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });

    // Обработка клика на кнопку "Назад" для совместимости
    document.querySelectorAll('a[href="javascript:history.back()"]').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            history.back();
        });
    });
    </script>
