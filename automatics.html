    // Функция для установки активной ссылки в навигации
    function setActiveNavLink() {
        const currentPath = window.location.pathname.split('/').pop() || 'automatics.html';
        const navLinks = document.querySelectorAll('#header-nav .nav-link');

        navLinks.forEach(link => {
            link.classList.remove('active');
            const href = link.getAttribute('href') || '';
            if (href.split('/').pop() === currentPath) {
                link.classList.add('active');
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        AOS.init({
            duration: 1500,
            once: true,
            offset: 100
        });

        fetch('header.html', { cache: 'no-store' })
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                setTimeout(setActiveNavLink, 100);
            })
            .catch(error => console.error('Error loading header:', error));

        fetch('footer.html', { cache: 'no-store' })
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
                setTimeout(function() {
                    AOS.refresh();
                }, 200);
            })
            .catch(error => console.error('Error loading footer:', error));
    });
</script>
    <!-- Навигация -->
    <div id="header-placeholder"></div>

    <!-- Основной контент -->
    <div class="container-fluid padding-side position-relative" style="margin-top: 52px;">
        <div class="border border-light border-opacity-25 rounded-5"
            style="background-color: rgba(255, 255, 255, 0.06); box-shadow: 0px 12px 90px rgba(0, 163, 255, 0.2);">

            <section id="automatics-hero" class="padding-medium">
                <div class="container">
                    <div class="row justify-content-center text-center mb-5" data-aos="fade-up" data-aos-duration="1500">
                        <div class="col-lg-8 d-flex flex-column align-items-center">
                            <h3 class="display-3 mb-4">Automatics_v18<span class="text-primary">.</span></h3>
                            <p class="lead">Automatics_v18 — мой скрипт для автоматической записи лекций в вузе. Он сам захватывает экран по расписанию и заливает запись на YouTube — здесь собраны все актуальные лекции. Выбери предмет, а затем — дату лекции.</p>
                        </div>
                    </div>

                    <!-- Карточки предметов -->
                    <div class="row g-4 justify-content-center" id="subjectsGrid" data-aos="fade-up" data-aos-duration="1500">
                        <!-- рендерится из LECTURES в скрипте внизу -->
                    </div>

                    <div class="row justify-content-center mt-5 text-center" data-aos="fade-up" data-aos-duration="1500">
                        <div class="col-lg-8 d-flex flex-wrap align-items-center justify-content-center gap-3">
                            <span class="updated-badge" id="updatedBadge">Обновлено: —</span>
                            <a href="https://github.com/kondrashov-m/automatics-v18" target="_blank" rel="noopener noreferrer" class="button">
                                <svg class="no-animate"><use xlink:href="#github"></use></svg>
                                <span>Исходный код на GitHub</span>
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Оверлей: список лекций предмета / просмотр видео -->
    <div class="modal-overlay" id="lectureModal">
        <div class="modal-panel">
            <button class="modal-close" id="lectureModalClose" aria-label="Закрыть">&times;</button>
            <div id="lectureModalBody"></div>
        </div>
    </div>

    <!-- Футер -->
    <div id="footer-placeholder"></div>

    <!-- Стрелка вверх -->
    <button id="scrollToTop" class="scroll-to-top" aria-label="Вернуться наверх">↑</button>

    <!-- Scripts -->
    <script src="js/jquery-1.11.0.min.js"></script>

    <!-- AOS script -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Bootstrap script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>

    <!-- Swiper script -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>

    <script src="js/plugins.js"></script>
    <script src="js/script.js"></script>

    <script>
    // ===== Лекции =====
    // Данные лекций живут в automatics/lectures.json — добавляй туда новые записи
    // вида { subject, title, date: "ГГГГ-ММ-ДД", youtube: "ссылка на видео" }.
    // Правку можно делать вручную или через admin-automatics.html (локальная админка).
    let LECTURES = [];
    let currentSubject = null;

    const MONTHS_RU = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

    function formatLectureDate(iso) {
        const parts = (iso || '').split('-');
        if (parts.length !== 3) return iso || '';
        const [y, m, d] = parts;
        const monthName = MONTHS_RU[Number(m) - 1];
        if (!monthName) return iso;
        return Number(d) + ' ' + monthName + ' ' + y;
    }

    function getYouTubeId(url) {
        const m = (url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
        return m ? m[1] : null;
    }

    // Подбираем пиктограмму по ключевым словам в названии предмета — без ручной
    // привязки иконок к каждому предмету в lectures.json.
    function getSubjectIcon(subject) {
        const s = (subject || '').toLowerCase();
        const has = function(keywords) { return keywords.some(function(k) { return s.indexOf(k) !== -1; }); };

        if (has(['backend', 'frontend', 'бэкенд', 'фронтенд', 'программир', 'разработк', 'веб-', 'javascript', 'python', 'алгоритм'])) return 'icon-subj-code';
        if (has(['баз данн', 'база данн', 'sql', 'субд'])) return 'icon-subj-database';
        if (has(['сет', 'network', 'tcp', 'ip-'])) return 'icon-subj-network';
        if (has(['безопас', 'крипто', 'security', 'информационн'])) return 'icon-subj-shield';
        if (has(['облач', 'cloud', 'devops', 'администрирован'])) return 'icon-subj-cloud';
        if (has(['математ', 'алгебр', 'матан', 'дискрет', 'геометр'])) return 'icon-subj-math';
        if (has(['физ'])) return 'icon-subj-physics';
        if (has(['статист', 'эконом', 'аналитик'])) return 'icon-subj-chart';
        if (has(['операцион', 'архитектур', 'схемотехник', 'электрон'])) return 'icon-subj-cpu';
        return 'icon-subj-book';
    }

    function pluralizeLectures(n) {
        const mod10 = n % 10;
        const mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return 'лекция';
        if ([2, 3, 4].indexOf(mod10) !== -1 && [12, 13, 14].indexOf(mod100) === -1) return 'лекции';
        return 'лекций';
    }

    function renderSubjects() {
        const grid = document.getElementById('subjectsGrid');
        if (!grid) return;

        if (!LECTURES.length) {
            grid.innerHTML = '<div class="col-12">' +
                    '<div class="subjects-empty-state">' +
                        '<div class="subjects-empty-icon">🎬</div>' +
                        '<h5 class="display-6">Упс! На данный момент лекций нет</h5>' +
                        '<p class="text-white-50 mb-0">Как только появится первая лекция — она сразу окажется здесь.</p>' +
                    '</div>' +
               '</div>';
            return;
        }

        const subjects = Array.from(new Set(LECTURES.map(function(l) { return l.subject; }))).sort(function(a, b) {
            return a.localeCompare(b, 'ru');
        });

        grid.innerHTML = subjects.map(function(subject) {
            const count = LECTURES.filter(function(l) { return l.subject === subject; }).length;
            const iconId = getSubjectIcon(subject);
            return '<div class="col-lg-4 col-md-6">' +
                        '<div class="subject-card">' +
                            '<div class="subject-icon"><svg><use xlink:href="#' + iconId + '"></use></svg></div>' +
                            '<div class="subject-top">' +
                                '<span class="subject-count-badge">' + count + ' ' + pluralizeLectures(count) + '</span>' +
                            '</div>' +
                            '<h5 class="display-6 subject-name">' + subject + '</h5>' +
                            '<button type="button" class="button open-subject-btn" data-subject="' + subject + '">' +
                                '<span>Смотреть лекции</span>' +
                            '</button>' +
                        '</div>' +
                   '</div>';
        }).join('');

        grid.querySelectorAll('.open-subject-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                openSubjectModal(this.dataset.subject);
            });
        });

        attachButtonRipple();
    }

    // ===== Оверлей: список дат лекции / просмотр видео =====
    function renderLectureListBody(subject) {
        const items = LECTURES
            .filter(function(l) { return l.subject === subject; })
            .sort(function(a, b) { return b.date.localeCompare(a.date); });

        const body = document.getElementById('lectureModalBody');

        const listHtml = items.map(function(l, idx) {
            const videoId = getYouTubeId(l.youtube);
            const thumb = videoId ? 'https://i.ytimg.com/vi/' + videoId + '/hqdefault.jpg' : '';
            return '<button type="button" class="lecture-list-item" data-idx="' + idx + '">' +
                        '<span class="lecture-list-thumb">' +
                            (thumb ? '<img src="' + thumb + '" alt="' + l.title + '" loading="lazy">' : '') +
                            '<svg><use xlink:href="#icon-play"></use></svg>' +
                        '</span>' +
                        '<span class="lecture-list-info">' +
                            '<span class="lecture-list-date">' + formatLectureDate(l.date) + '</span>' +
                            '<span class="lecture-list-title">' + l.title + '</span>' +
                        '</span>' +
                   '</button>';
        }).join('');

        body.innerHTML =
            '<h5 class="display-6 mb-1">' + subject + '</h5>' +
            '<p class="text-white-50 mb-0">Выбери дату лекции</p>' +
            '<div class="lecture-list">' +
                (items.length ? listHtml : '<div class="subjects-empty">Лекций по этому предмету пока нет — загляни позже.</div>') +
            '</div>';

        body.querySelectorAll('.lecture-list-item').forEach(function(btn) {
            btn.addEventListener('click', function() {
                showLectureVideo(items[Number(this.dataset.idx)], subject);
            });
        });
    }

    function showLectureVideo(lecture, subject) {
        const videoId = getYouTubeId(lecture.youtube);
        if (!videoId) return;

        const body = document.getElementById('lectureModalBody');
        body.innerHTML =
            '<button type="button" class="modal-back-btn" id="lectureBackBtn">' +
                '<svg style="width:16px;height:16px;"><use xlink:href="#icon-chevron-left"></use></svg>' +
                '<span>Назад к списку лекций</span>' +
            '</button>' +
            '<div class="video-frame-wrap">' +
                '<iframe src="https://www.youtube.com/embed/' + videoId + '?autoplay=1" ' +
                    'title="' + lecture.title + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" ' +
                    'allowfullscreen></iframe>' +
            '</div>' +
            '<div class="video-info-row">' +
                '<h5 class="video-info-title">' + lecture.title + '</h5>' +
                '<a href="' + lecture.youtube + '" target="_blank" rel="noopener noreferrer" class="button">' +
                    '<span>Открыть на YouTube</span>' +
                    '<svg><use xlink:href="#arrow-right"></use></svg>' +
                '</a>' +
            '</div>';

        document.getElementById('lectureBackBtn').addEventListener('click', function() {
            renderLectureListBody(subject);
        });

        attachButtonRipple();
    }

    function openSubjectModal(subject) {
        currentSubject = subject;
        renderLectureListBody(subject);
        document.getElementById('lectureModal').classList.add('active');
    }

    function closeLectureModal() {
        document.getElementById('lectureModal').classList.remove('active');
        document.getElementById('lectureModalBody').innerHTML = '';
    }

    document.getElementById('lectureModalClose').addEventListener('click', closeLectureModal);
    document.getElementById('lectureModal').addEventListener('click', function(e) {
        if (e.target === this) closeLectureModal();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLectureModal();
    });

    fetch('automatics/lectures.json', { cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            // Подчищаем случайные пробелы по краям — иначе "Предмет" и "Предмет "
            // из lectures.json превращаются в две разные плитки.
            LECTURES = (data.lectures || []).map(function(l) {
                return Object.assign({}, l, {
                    subject: (l.subject || '').trim(),
                    title: (l.title || '').trim()
                });
            });
            renderSubjects();
            const updatedBadge = document.getElementById('updatedBadge');
            if (updatedBadge && data.updated) {
                updatedBadge.textContent = 'Обновлено: ' + data.updated;
            }
        })
        .catch(function(err) {
            console.error('Не удалось загрузить automatics/lectures.json', err);
            const grid = document.getElementById('subjectsGrid');
            if (grid) grid.innerHTML = '<div class="col-12 subjects-empty">Не удалось загрузить список лекций.</div>';
        });

    // Эффект волны для кнопок (переприменяется после рендера карточек/оверлея)
    function attachButtonRipple() {
        document.querySelectorAll('.button:not([data-ripple-bound])').forEach(function(btn) {
            btn.dataset.rippleBound = '1';
            btn.addEventListener('mousemove', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                this.style.setProperty('--x', x + 'px');
                this.style.setProperty('--y', y + 'px');
            });

            btn.addEventListener('mouseleave', function() {
                this.style.setProperty('--size', '0');
            });
        });
    }
    attachButtonRipple();

    // Стрелка вверх
    const scrollToTopBtn = document.getElementById('scrollToTop');

    window.addEventListener('scroll', function() {
        if (window.pageYOffset > 300) {
            scrollToTopBtn.classList.add('active');
        } else {
            scrollToTopBtn.classList.remove('active');
        }
    });

    scrollToTopBtn.addEventListener('click', function() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });

    // Скрыть прелоадер после загрузки
    window.addEventListener('load', function() {
        document.querySelector('.preloader').style.opacity = '0';
        setTimeout(() => {
            document.querySelector('.preloader').style.display = 'none';
        }, 500);
    });
    </script>
</body>
