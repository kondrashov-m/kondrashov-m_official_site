    function setActiveNavLink() {

    <script>
    // ===== Лекции =====
    // Данные лекций живут в automatics/lectures.json — добавляй туда новые записи
    // вида { subject, title, date: "ГГГГ-ММ-ДД", youtube: "ссылка на видео" }.
    let LECTURES = [];
    let currentSubject = 'Все';

    const MONTHS_RU = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

    function formatLectureDate(iso) {
        const parts = (iso || '').split('-');
        if (parts.length !== 3) return iso || '';
        const [y, m, d] = parts;
        const monthName = MONTHS_RU[Number(m) - 1];
        if (!monthName) return iso;
        return Number(d) + ' ' + monthName + ' ' + y;
    }

    function getYouTubeId(url) {
        const m = (url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
        return m ? m[1] : null;
    }

    function renderSubjectFilter() {
        const filter = document.getElementById('subjectFilter');
        if (!filter) return;

        if (!LECTURES.length) {
            filter.innerHTML = '';
            filter.style.display = 'none';
            return;
        }
        filter.style.display = '';

        const subjects = Array.from(new Set(LECTURES.map(function(l) { return l.subject; }))).sort(function(a, b) {
            return a.localeCompare(b, 'ru');
        });
        const options = ['Все'].concat(subjects);

        filter.innerHTML = options.map(function(subject) {
            const active = subject === currentSubject ? ' active' : '';
            return '<button type="button" class="subject-pill' + active + '" data-subject="' + subject + '">' + subject + '</button>';
        }).join('');

        filter.querySelectorAll('.subject-pill').forEach(function(btn) {
            btn.addEventListener('click', function() {
                currentSubject = this.dataset.subject;
                renderSubjectFilter();
                renderLectures();
            });
        });
    }

    function renderLectures() {
        const grid = document.getElementById('lecturesGrid');
        if (!grid) return;

        if (!LECTURES.length) {
            grid.innerHTML = '<div class="col-12">' +
                    '<div class="lectures-empty-state">' +
                        '<div class="lectures-empty-icon">🎬</div>' +
                        '<h5 class="display-6">Упс! На данный момент лекций нет</h5>' +
                        '<p class="text-white-50 mb-0">Как только появится первая лекция — она сразу окажется здесь.</p>' +
                    '</div>' +
               '</div>';
            return;
        }

        const filtered = LECTURES
            .filter(function(l) { return currentSubject === 'Все' || l.subject === currentSubject; })
            .sort(function(a, b) { return b.date.localeCompare(a.date); });

        if (!filtered.length) {
            grid.innerHTML = '<div class="col-12 lectures-empty">Лекций по этому предмету пока нет — загляни позже.</div>';
            return;
        }

        grid.innerHTML = filtered.map(function(l) {
            const videoId = getYouTubeId(l.youtube);
            const thumb = videoId ? 'https://i.ytimg.com/vi/' + videoId + '/hqdefault.jpg' : '';
            return '<div class="col-lg-4 col-md-6">' +
                        '<a href="' + l.youtube + '" target="_blank" rel="noopener noreferrer" class="lecture-card">' +
                            '<div class="lecture-thumb">' +
                                (thumb ? '<img src="' + thumb + '" alt="' + l.title + '" loading="lazy">' : '') +
                                '<span class="lecture-play"><svg><use xlink:href="#icon-play"></use></svg></span>' +
                            '</div>' +
                            '<div class="lecture-body">' +
                                '<div class="lecture-top">' +
                                    '<span class="subject-badge">' + l.subject + '</span>' +
                                    '<span class="lecture-date">' + formatLectureDate(l.date) + '</span>' +
                                '</div>' +
                                '<h5 class="lecture-title">' + l.title + '</h5>' +
                            '</div>' +
                        '</a>' +
                   '</div>';
        }).join('');
    }

    fetch('automatics/lectures.json', { cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            LECTURES = data.lectures || [];
            renderSubjectFilter();
            renderLectures();
            const updatedBadge = document.getElementById('updatedBadge');
            if (updatedBadge && data.updated) {
                updatedBadge.textContent = 'Обновлено: ' + data.updated;
            }
        })
        .catch(function(err) {
            console.error('Не удалось загрузить automatics/lectures.json', err);
            const grid = document.getElementById('lecturesGrid');
            if (grid) grid.innerHTML = '<div class="col-12 lectures-empty">Не удалось загрузить список лекций.</div>';
        });

    // Эффект волны для кнопок
    document.querySelectorAll('.button').forEach(btn => {
        btn.addEventListener('mousemove', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            this.style.setProperty('--x', x + 'px');
            this.style.setProperty('--y', y + 'px');
        });

        btn.addEventListener('mouseleave', function() {
            this.style.setProperty('--size', '0');
        });
    });

    // Стрелка вверх
    const scrollToTopBtn = document.getElementById('scrollToTop');

    window.addEventListener('scroll', function() {
        if (window.pageYOffset > 300) {
            scrollToTopBtn.classList.add('active');
        } else {
            scrollToTopBtn.classList.remove('active');
        }
    });

    scrollToTopBtn.addEventListener('click', function() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });

    // Скрыть прелоадер после загрузки
    window.addEventListener('load', function() {
        document.querySelector('.preloader').style.opacity = '0';
        setTimeout(() => {
            document.querySelector('.preloader').style.display = 'none';
        }, 500);
    });
    </script>
</body>
</html>
