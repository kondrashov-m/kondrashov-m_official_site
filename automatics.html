    <style>
    /* Automatics_v18 — та же стилистика, что на главной (index.html) */

    #page-automatics {
        font-family: 'Poppins', sans-serif;
        font-style: normal;
        overflow-wrap: anywhere;
    }

    #page-automatics #header-placeholder,
    #page-automatics #header-placeholder *,
    #page-automatics #footer-placeholder,
    #page-automatics #footer-placeholder * {
        font-family: var(--body-font);
        font-style: italic;
    }

    /* Bebas Neue не поддерживает кириллицу — без явного фолбэка браузер брал
       для русских букв системный шрифт (обычно обычной ширины и насыщенности),
       из-за чего в смешанных заголовках вроде "BACKEND-разработка" латиница
       и кириллица выглядели как два разных шрифта. Oswald — тоже узкий и
       плотный, с поддержкой кириллицы, поэтому обе части заголовка теперь
       выглядят одним стилем. */
    #page-automatics h1, #page-automatics h2, #page-automatics h3, #page-automatics h4, #page-automatics h5, #page-automatics h6,
    #page-automatics .display-1, #page-automatics .display-2, #page-automatics .display-3,
    #page-automatics .display-4, #page-automatics .display-5, #page-automatics .display-6 {
        font-family: 'Bebas Neue', 'Oswald', sans-serif;
        font-weight: 600;
        letter-spacing: 0.015em;
    }

    #page-automatics .kx-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #00a3ff;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 1rem;
    }

    #page-automatics .kx-eyebrow::before {
        content: '';
        width: 30px; height: 2px;
        background: linear-gradient(90deg, #00a3ff, #7b5cff);
        display: inline-block;
    }

    #page-automatics .kx-grad-text {
        background: linear-gradient(120deg, #00a3ff, #7b5cff 60%, #00e0c6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    #page-automatics .kx-section { padding: 5.5rem 0; position: relative; overflow: hidden; }

    @media (max-width: 768px) {
        #page-automatics .kx-section { padding: 3.5rem 0; }
    }

    /* Hero — как на Берлоге: текст и карточки предметов в одной сетке */
    #page-automatics .kx-hero {
        position: relative;
        padding-top: 7rem;
        padding-bottom: 4rem;
        overflow: hidden;
    }

    @media (max-width: 768px) {
        #page-automatics .kx-hero { padding-top: 4rem; }
    }

    #page-automatics .kx-hero-title {
        font-size: clamp(3rem, 6.5vw, 5.6rem);
        line-height: 0.95;
        margin-bottom: 1.25rem;
    }

    #page-automatics .kx-hero-lead {
        font-size: 1.1rem;
        color: rgba(255, 255, 255, 0.7);
        max-width: 480px;
        margin-bottom: 2rem;
    }

    /* Hero-сетка: текст — обычная ячейка сетки, а не отдельная колонка,
       поэтому карточки без промежутков продолжают заполнять всю ширину,
       как только текстовый блок заканчивается. */
    #page-automatics .kx-hero-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        align-items: stretch;
    }

    #page-automatics .kx-hero-intro {
        grid-column: span 2;
        align-self: start;
    }

    @media (max-width: 991px) {
        #page-automatics .kx-hero-grid { grid-template-columns: repeat(2, 1fr); }
        #page-automatics .kx-hero-intro { grid-column: span 2; }
    }

    @media (max-width: 576px) {
        #page-automatics .kx-hero-grid { grid-template-columns: 1fr; }
        #page-automatics .kx-hero-intro { grid-column: span 1; }
    }

    /* Декоративное свечение на фоне — как на главной */
    #page-automatics .kx-glow {
        position: absolute;
        width: 640px; height: 640px;
        border-radius: 50%;
        filter: blur(60px);
        z-index: -1;
        pointer-events: none;
    }

    #page-automatics .kx-glow-1 {
        background: radial-gradient(circle, rgba(0, 163, 255, 0.3), transparent 70%);
        top: -220px; right: -180px;
    }

    /* Единый стиль кнопок — как на главной.
       Все правила спрятаны за #page-automatics: у общего styles.css есть своё
       старое правило .button:hover { background: #0078FF; } — оно весит
       больше (2 класса), чем локальный .button без ID (1 класс), поэтому
       без ID-префикса синий фон из styles.css побеждал именно при наведении. */
    #page-automatics .button {
        position: relative;
        background: linear-gradient(135deg, #00a3ff, #7b5cff);
        border: none;
        color: #fff;
        padding: 0.9rem 1.9rem;
        font-weight: 600;
        font-family: 'Poppins', sans-serif;
        transition: all 0.35s ease;
        border-radius: 50px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0, 163, 255, 0.25);
        /* Без этого при клике/тапе браузер на мгновение перекрывает кнопку
           своей стандартной тёмной подсветкой нажатия ("вспышка чёрным") */
        -webkit-tap-highlight-color: transparent;
    }

    #page-automatics .button:hover,
    #page-automatics .button:focus,
    #page-automatics .button:active {
        color: #fff;
    }

    #page-automatics .button:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 34px rgba(123, 92, 255, 0.35);
    }

    #page-automatics .button:focus-visible {
        outline: 2px solid rgba(0, 163, 255, 0.6);
        outline-offset: 3px;
    }

    #page-automatics .button span { position: relative; pointer-events: none; }

    #page-automatics .button::before {
        --size: 0;
        content: '';
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--size);
        height: var(--size);
        background: radial-gradient(circle closest-side, rgba(255,255,255,0.3), transparent);
        transform: translate(-50%, -50%);
        transition: width .3s ease, height .3s ease;
        border-radius: 50%;
        pointer-events: none;
    }

    #page-automatics .button:hover::before {
        --size: 400px;
    }

    /* Без свечения — для кнопок, которые стоят группой (карточки предметов):
       у сплошной .button свечение рассчитано на одиночную кнопку, в ряду
       свечения соседних кнопок сливаются в одно пятно. */
    #page-automatics .button.kx-btn-ghost {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: none;
    }

    #page-automatics .button.kx-btn-ghost:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(0, 163, 255, 0.5);
        box-shadow: 0 8px 24px rgba(0, 163, 255, 0.15);
    }

    #page-automatics .button svg {
        width: 20px;
        height: 20px;
        position: relative;
        transition: transform 0.3s ease;
    }

    #page-automatics .button:hover svg:not(.no-animate) {
        transform: translateX(3px);
    }

    .lead {
        font-size: 1.1rem;
        color: rgba(255, 255, 255, 0.8);
        line-height: 1.6;
    }

    .text-primary {
        color: #00a3ff !important;
    }

    .text-white-50 {
        color: rgba(255, 255, 255, 0.5) !important;
    }

    /* Карточка предмета — как .protocol-card на Берлоге */
    .subject-card {
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px;
        padding: 2rem;
        transition: all 0.35s ease;
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .subject-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 15px 30px rgba(0, 163, 255, 0.2);
        border-color: rgba(0, 163, 255, 0.35);
    }

    .subject-card .open-subject-btn {
        margin-top: auto;
    }

    .subject-count-badge {
        /* Прямой ребёнок flex-колонки .subject-card по умолчанию растягивается
           на всю ширину (align-items: stretch) — align-self возвращает бейджу
           обычный размер по содержимому. */
        align-self: flex-start;
        font-size: 0.7rem;
        font-weight: 600;
        padding: 0.3rem 0.6rem;
        border-radius: 50px;
        border: 1px solid rgba(0, 163, 255, 0.35);
        color: #00a3ff;
        background: rgba(0, 163, 255, 0.1);
        white-space: nowrap;
        margin-bottom: 1rem;
    }

    .subject-name {
        position: relative;
        margin-bottom: 1rem;
    }

    .subjects-empty {
        grid-column: 1 / -1;
        color: rgba(255, 255, 255, 0.4);
        text-align: center;
        padding: 2rem 1rem;
    }

    .subjects-empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 3.5rem 1.5rem;
        background-color: rgba(255, 255, 255, 0.04);
        border: 1px dashed rgba(255, 255, 255, 0.15);
        border-radius: 28px;
    }

    .subjects-empty-icon {
        font-size: 3rem;
        line-height: 1;
        margin-bottom: 1.25rem;
    }

    .subjects-empty-state h5 {
        margin-bottom: 0.6rem;
    }

    .subjects-empty-state p {
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
    }

    .updated-badge {
        display: inline-flex;
        align-items: center;
        /* Подогнано под .button (padding 0.9rem 1.9rem, font-weight 600) —
           чтобы бейдж и кнопка рядом смотрелись одной высоты и "веса" */
        padding: 0.85rem 1.6rem;
        border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.85);
        font-size: 0.95rem;
        font-weight: 600;
        white-space: nowrap;
    }

    /* Версия в шапке */
    .version-info {
        cursor: help;
        border-bottom: 1px dashed #ffffff;
        color: #ffffff;
        transition: color 0.3s ease;
    }

    .version-info:hover {
        color: #00a3ff;
    }

    /* Стрелка вверх */
    .scroll-to-top {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 52px;
        height: 52px;
        background: linear-gradient(135deg, #00a3ff, #7b5cff);
        border: none;
        border-radius: 50%;
        color: #fff;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        box-shadow: 0 10px 26px rgba(0, 163, 255, 0.35);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .scroll-to-top:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 30px rgba(123, 92, 255, 0.4);
    }

    .scroll-to-top.active {
        opacity: 1;
        visibility: visible;
    }

    /* Адаптивность */
    @media (max-width: 768px) {
        #page-automatics .button {
            width: 100%;
        }

        .updated-badge {
            width: 100%;
            justify-content: center;
            box-sizing: border-box;
        }

        .scroll-to-top {
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            font-size: 18px;
        }
    }

    /* Оверлей выбора лекции / просмотра видео */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 1.5rem;
    }

    .modal-overlay.active {
        display: flex;
    }

    .modal-panel {
        background: #0d0f12;
        border: 1px solid rgba(0, 163, 255, 0.3);
        border-radius: 28px;
        padding: 2rem;
        max-width: 820px;
        width: 100%;
        max-height: calc(100vh - 3rem);
        overflow-y: auto;
        position: relative;
        box-shadow: 0 20px 60px rgba(0, 163, 255, 0.15);
    }

    .modal-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.08);
        color: white;
        font-size: 1.2rem;
        line-height: 1;
        cursor: pointer;
    }

    /* Список лекций внутри оверлея */
    .lecture-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 1.25rem;
    }

    .lecture-list-item {
        display: flex;
        align-items: center;
        gap: 1rem;
        width: 100%;
        text-align: left;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 0.75rem;
        cursor: pointer;
        transition: all 0.25s ease;
        color: inherit;
        font: inherit;
    }

    .lecture-list-item:hover {
        border-color: rgba(0, 163, 255, 0.4);
        background: rgba(0, 163, 255, 0.08);
    }

    .lecture-list-thumb {
        position: relative;
        flex-shrink: 0;
        width: 120px;
        aspect-ratio: 16 / 9;
        border-radius: 10px;
        overflow: hidden;
        background-color: #05070a;
    }

    .lecture-list-thumb img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .lecture-list-thumb svg {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 30px;
        height: 30px;
        color: white;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
    }

    .lecture-list-info {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
    }

    .lecture-list-date {
        font-size: 0.78rem;
        font-weight: 600;
        color: #00a3ff;
    }

    .lecture-list-title {
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.35;
    }

    /* Просмотр видео внутри оверлея */
    .modal-back-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        padding: 0;
        margin-bottom: 1rem;
        transition: color 0.2s ease;
    }

    .modal-back-btn:hover {
        color: #00a3ff;
    }

    .video-frame-wrap {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        border-radius: 14px;
        overflow: hidden;
        background: #000;
    }

    .video-frame-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
    }

    .video-info-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1.25rem;
    }

    .video-info-title {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
    }

    .padding-side {
        padding-left: 5%;
        padding-right: 5%;
    }

    @media (max-width: 768px) {
        .padding-side {
            padding-left: 3%;
            padding-right: 3%;
        }

        .lecture-list-item {
            align-items: flex-start;
        }

        .lecture-list-thumb {
            width: 96px;
        }
    }

    /* Навигация */
    .navbar-nav .nav-link {
        color: rgba(255, 255, 255, 0.8) !important;
        transition: color 0.3s ease;
    }

    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link.active {
        color: #00a3ff !important;
    }

    .dropdown-menu {
        background-color: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .dropdown-item {
        color: white;
        transition: all 0.3s ease;
    }

    .dropdown-item:hover {
        background-color: rgba(0, 163, 255, 0.2);
        color: #00a3ff;
    }

    .badge.bg-dark {
        background-color: rgba(0, 163, 255, 0.3) !important;
        color: white !important;
    }

    /* Прелоадер */
    .preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease;
    }

    .loader {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #00a3ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    </style>
</head>

<body id="page-automatics">

    <!-- SVG спрайт -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol id="arrow-right" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </symbol>
        <symbol id="icon-play" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="11" fill="rgba(0,0,0,0.35)" />
            <path fill="currentColor" d="M10 8.64v6.72a.6.6 0 0 0 .9.52l5.6-3.36a.6.6 0 0 0 0-1.04l-5.6-3.36a.6.6 0 0 0-.9.52Z" />
        </symbol>
        <symbol id="icon-chevron-left" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 6l-6 6 6 6" />

        <symbol id="github" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5c.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34c-.46-1.16-1.11-1.47-1.11-1.47c-.91-.62.07-.6.07-.6c1 .07 1.53 1.03 1.53 1.03c.87 1.52 2.34 1.07 2.91.83c.09-.65.35-1.09.63-1.34c-2.22-.25-4.55-1.11-4.55-4.92c0-1.11.38-2 1.03-2.71c-.1-.25-.45-1.29.1-2.64c0 0 .84-.27 2.75 1.02c.79-.22 1.65-.33 2.5-.33c.85 0 1.71.11 2.5.33c1.91-1.29 2.75-1.02 2.75-1.02c.55 1.35.2 2.39.1 2.64c.65.71 1.03 1.6 1.03 2.71c0 3.82-2.34 4.66-4.57 4.91c.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2Z" />
        </symbol>
    </svg>

    <div class="preloader">
        <div class="loader"></div>
    </div>
<script>
    // Функция для установки активной ссылки в навигации
    function setActiveNavLink() {
        const currentPath = window.location.pathname.split('/').pop() || 'automatics.html';
        const navLinks = document.querySelectorAll('#header-nav .nav-link');

        navLinks.forEach(link => {
            link.classList.remove('active');
            const href = link.getAttribute('href') || '';
            if (href.split('/').pop() === currentPath) {
                link.classList.add('active');
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        AOS.init({
            duration: 1500,
            once: true,
            offset: 100
        });

        fetch('header.html', { cache: 'no-store' })
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                setTimeout(setActiveNavLink, 100);
            })
            .catch(error => console.error('Error loading header:', error));

        fetch('footer.html', { cache: 'no-store' })
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
                setTimeout(function() {
                    AOS.refresh();
                }, 200);
            })
            .catch(error => console.error('Error loading footer:', error));
    });
</script>
    <!-- Навигация -->
    <div id="header-placeholder"></div>

    <!-- Основной контент -->
    <section id="automatics-hero" class="kx-hero">
        <div class="kx-glow kx-glow-1"></div>
        <div class="container">
            <!-- Текст и карточки — ячейки одной сетки: как только текст заканчивается,
                 карточки естественно продолжают заполнять всю ширину под ним. -->
            <div class="kx-hero-grid" data-aos="fade-up" data-aos-duration="1200">
                <div class="kx-hero-intro">
                    <span class="kx-eyebrow">Архив лекций</span>
                    <h1 class="kx-hero-title"><span class="kx-grad-text">Automatics_v18.</span></h1>
                    <p class="kx-hero-lead">Automatics_v18 — мой скрипт для автоматической записи лекций в вузе. Он сам захватывает экран по расписанию и заливает запись на YouTube — здесь собраны все актуальные лекции. Выбери предмет, а затем — дату лекции.</p>
                    <span class="updated-badge" id="updatedBadge">Обновлено: —</span>
                </div>
                <!-- Карточки предметов — рендерятся из LECTURES в скрипте внизу.
                     display:contents делает этот div невидимым для сетки, так что
                     карточки внутри становятся её обычными ячейками. -->
                <div id="subjectsGrid" style="display: contents;"></div>
            </div>

            <!-- Кнопка — после карточек с лекциями, не в шапке -->
            <div class="text-center mt-5" data-aos="fade-up" data-aos-anchor="#subjectsGrid" data-aos-duration="1200">
                <a href="https://github.com/kondrashov-m/automatics-v18" target="_blank" rel="noopener noreferrer" class="button">
                    <svg class="no-animate"><use xlink:href="#github"></use></svg>
                    <span>Исходный код на GitHub</span>
                </a>
            </div>
        </div>
    </section>

    <!-- Оверлей: список лекций предмета / просмотр видео -->
    <div class="modal-overlay" id="lectureModal">
        <div class="modal-panel">
            <button class="modal-close" id="lectureModalClose" aria-label="Закрыть">&times;</button>
            <div id="lectureModalBody"></div>
        </div>
    </div>

    <!-- Футер -->
    <div id="footer-placeholder"></div>

    <!-- Стрелка вверх -->
    <button id="scrollToTop" class="scroll-to-top" aria-label="Вернуться наверх">↑</button>

    <!-- Scripts -->
    <script src="js/jquery-1.11.0.min.js"></script>

    <!-- AOS script -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Bootstrap script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>

    <!-- Swiper script -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>

    <script src="js/plugins.js"></script>
    <script src="js/script.js"></script>

    <script>
    // ===== Лекции =====
    // Данные лекций живут в automatics/lectures.json — добавляй туда новые записи
    // вида { subject, title, date: "ГГГГ-ММ-ДД", youtube: "ссылка на видео" }.
    // Правку можно делать вручную или через admin-automatics.html (локальная админка).
    let LECTURES = [];
    let currentSubject = null;

    const MONTHS_RU = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

    function formatLectureDate(iso) {
        const parts = (iso || '').split('-');
        if (parts.length !== 3) return iso || '';
        const [y, m, d] = parts;
        const monthName = MONTHS_RU[Number(m) - 1];
        if (!monthName) return iso;
        return Number(d) + ' ' + monthName + ' ' + y;
    }

    function getYouTubeId(url) {
        const m = (url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
        return m ? m[1] : null;
    }

    function pluralizeLectures(n) {
        const mod10 = n % 10;
        const mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return 'лекция';
        if ([2, 3, 4].indexOf(mod10) !== -1 && [12, 13, 14].indexOf(mod100) === -1) return 'лекции';
        return 'лекций';
    }

    function renderSubjects() {
        const grid = document.getElementById('subjectsGrid');
        if (!grid) return;

        if (!LECTURES.length) {
            grid.innerHTML =
                    '<div class="subjects-empty-state">' +
                        '<div class="subjects-empty-icon">🎬</div>' +
                        '<h5 class="display-6">Упс! На данный момент лекций нет</h5>' +
                        '<p class="text-white-50 mb-0">Как только появится первая лекция — она сразу окажется здесь.</p>' +
                    '</div>';
            return;
        }

        const subjects = Array.from(new Set(LECTURES.map(function(l) { return l.subject; }))).sort(function(a, b) {
            return a.localeCompare(b, 'ru');
        });

        grid.innerHTML = subjects.map(function(subject) {
            const count = LECTURES.filter(function(l) { return l.subject === subject; }).length;
            return '<div class="subject-card">' +
                        '<h5 class="display-6 subject-name">' + subject + '</h5>' +
                        '<span class="subject-count-badge">' + count + ' ' + pluralizeLectures(count) + '</span>' +
                        '<button type="button" class="button kx-btn-ghost w-100 open-subject-btn" data-subject="' + subject + '">' +
                            '<span>Смотреть лекции</span>' +
                        '</button>' +
                   '</div>';
        }).join('');

        grid.querySelectorAll('.open-subject-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                openSubjectModal(this.dataset.subject);
            });
        });

        attachButtonRipple();
    }

    // ===== Оверлей: список дат лекции / просмотр видео =====
    function renderLectureListBody(subject) {
        const items = LECTURES
            .filter(function(l) { return l.subject === subject; })
            .sort(function(a, b) { return b.date.localeCompare(a.date); });

        const body = document.getElementById('lectureModalBody');

        const listHtml = items.map(function(l, idx) {
            const videoId = getYouTubeId(l.youtube);
            const thumb = videoId ? 'https://i.ytimg.com/vi/' + videoId + '/hqdefault.jpg' : '';
            return '<button type="button" class="lecture-list-item" data-idx="' + idx + '">' +
                        '<span class="lecture-list-thumb">' +
                            (thumb ? '<img src="' + thumb + '" alt="' + l.title + '" loading="lazy">' : '') +
                            '<svg><use xlink:href="#icon-play"></use></svg>' +
                        '</span>' +
                        '<span class="lecture-list-info">' +
                            '<span class="lecture-list-date">' + formatLectureDate(l.date) + '</span>' +
                            '<span class="lecture-list-title">' + l.title + '</span>' +
                        '</span>' +
                   '</button>';
        }).join('');

        body.innerHTML =
            '<h5 class="display-6 mb-1">' + subject + '</h5>' +
            '<p class="text-white-50 mb-0">Выбери дату лекции</p>' +
            '<div class="lecture-list">' +
                (items.length ? listHtml : '<div class="subjects-empty">Лекций по этому предмету пока нет — загляни позже.</div>') +
            '</div>';

        body.querySelectorAll('.lecture-list-item').forEach(function(btn) {
            btn.addEventListener('click', function() {
                showLectureVideo(items[Number(this.dataset.idx)], subject);
            });
        });
    }

    function showLectureVideo(lecture, subject) {
        const videoId = getYouTubeId(lecture.youtube);
        if (!videoId) return;

        const body = document.getElementById('lectureModalBody');
        body.innerHTML =
            '<button type="button" class="modal-back-btn" id="lectureBackBtn">' +
                '<svg style="width:16px;height:16px;"><use xlink:href="#icon-chevron-left"></use></svg>' +
                '<span>Назад к списку лекций</span>' +
            '</button>' +
            '<div class="video-frame-wrap">' +
                '<iframe src="https://www.youtube.com/embed/' + videoId + '?autoplay=1" ' +
                    'title="' + lecture.title + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" ' +
                    'allowfullscreen></iframe>' +
            '</div>' +
            '<div class="video-info-row">' +
                '<h5 class="video-info-title">' + lecture.title + '</h5>' +
                '<a href="' + lecture.youtube + '" target="_blank" rel="noopener noreferrer" class="button">' +
                    '<span>Открыть на YouTube</span>' +
                    '<svg><use xlink:href="#arrow-right"></use></svg>' +
                '</a>' +
            '</div>';

        document.getElementById('lectureBackBtn').addEventListener('click', function() {
            renderLectureListBody(subject);
        });

        attachButtonRipple();
    }

    function openSubjectModal(subject) {
        currentSubject = subject;
        renderLectureListBody(subject);
        document.getElementById('lectureModal').classList.add('active');
    }

    function closeLectureModal() {
        document.getElementById('lectureModal').classList.remove('active');
        document.getElementById('lectureModalBody').innerHTML = '';
    }

    document.getElementById('lectureModalClose').addEventListener('click', closeLectureModal);
    document.getElementById('lectureModal').addEventListener('click', function(e) {
        if (e.target === this) closeLectureModal();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLectureModal();
    });

    fetch('automatics/lectures.json', { cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            // Подчищаем случайные пробелы по краям — иначе "Предмет" и "Предмет "
            // из lectures.json превращаются в две разные плитки.
            LECTURES = (data.lectures || []).map(function(l) {
                return Object.assign({}, l, {
                    subject: (l.subject || '').trim(),
                    title: (l.title || '').trim()
                });
            });
            renderSubjects();
            const updatedBadge = document.getElementById('updatedBadge');
            if (updatedBadge && data.updated) {
                updatedBadge.textContent = 'Обновлено: ' + data.updated;
            }
        })
        .catch(function(err) {
            console.error('Не удалось загрузить automatics/lectures.json', err);
            const grid = document.getElementById('subjectsGrid');
            if (grid) grid.innerHTML = '<div class="subjects-empty">Не удалось загрузить список лекций.</div>';
        });

    // Эффект волны для кнопок (переприменяется после рендера карточек/оверлея)
    function attachButtonRipple() {
        document.querySelectorAll('.button:not([data-ripple-bound])').forEach(function(btn) {
            btn.dataset.rippleBound = '1';
            btn.addEventListener('mousemove', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                this.style.setProperty('--x', x + 'px');
                this.style.setProperty('--y', y + 'px');
            });

            btn.addEventListener('mouseleave', function() {
                this.style.setProperty('--size', '0');
            });
        });
    }
    attachButtonRipple();

    // Стрелка вверх
    const scrollToTopBtn = document.getElementById('scrollToTop');

    window.addEventListener('scroll', function() {
        if (window.pageYOffset > 300) {
            scrollToTopBtn.classList.add('active');
        } else {
            scrollToTopBtn.classList.remove('active');
        }
    });

    scrollToTopBtn.addEventListener('click', function() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });

    // Скрыть прелоадер после загрузки
    window.addEventListener('load', function() {
        document.querySelector('.preloader').style.opacity = '0';
        setTimeout(() => {
            document.querySelector('.preloader').style.display = 'none';
        }, 500);
    });
    </script>
</body>
