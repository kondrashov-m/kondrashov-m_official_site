            .preloader {
                position: fixed;      /* Фиксированное позиционирование поверх всего */
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #000;     /* Черный фон */
                z-index: 9999;        /* Очень высокий z-index, чтобы быть поверх всего */
                display: flex;
                align-items: center;
                justify-content: center;
                transition: opacity 0.5s ease;  /* Плавное исчезновение */
            }

            /* Сам спиннер (вращающийся круг) */
            .loader {
                width: 50px;
                height: 50px;
                border: 3px solid rgba(255,255,255,0.1);           /* Светло-серая обводка */
                border-top-color: #00a3ff;                          /* Верхняя часть - синяя */
                border-radius: 50%;                                  /* Круглая форма */
                animation: spin 1s linear infinite;                  /* Бесконечное вращение */
            }

            /* Анимация вращения */
            @keyframes spin {
                to { transform: rotate(360deg); }                    /* Поворот на 360 градусов */
            }

    <script>
    // Инициализация AOS
    AOS.init({
        duration: 1500,
        once: true,
        offset: 100
    });

    // Функция для стрелки вверх
    const scrollToTopBtn = document.getElementById('scrollToTop');
    
    window.addEventListener('scroll', function() {
        if (window.pageYOffset > 300) {
            scrollToTopBtn.classList.add('active');
        } else {
            scrollToTopBtn.classList.remove('active');
        }
    });
    
    scrollToTopBtn.addEventListener('click', function() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });
    </script>

<script>
// Загрузка header и footer
document.addEventListener('DOMContentLoaded', function() {
    // Загрузка header
    fetch('header.html')
        .then(response => response.text())
        .then(data => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(data, 'text/html');
            const content = doc.querySelector('body').innerHTML;
            document.getElementById('header-placeholder').innerHTML = content;
            setActiveNavLink();
            setTimeout(() => AOS.refresh(), 200);
        })
        .catch(error => console.error('Error loading header:', error));

    // Загрузка footer
    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(data, 'text/html');
            const content = doc.querySelector('body').innerHTML;
            document.getElementById('footer-placeholder').innerHTML = content;
            setTimeout(() => AOS.refresh(), 200);
        })
        .catch(error => console.error('Error loading footer:', error));
});

// Функция для установки активной ссылки в навигации
function setActiveNavLink() {
    const currentPath = window.location.pathname.split('/').pop();
    const navLinks = document.querySelectorAll('#header-nav .nav-link');

    navLinks.forEach(link => {
        link.classList.remove('active');
        const href = link.getAttribute('href') || '';
        const hrefFile = href.split('/').pop();
        if (hrefFile === currentPath || (currentPath === '' && hrefFile === 'index.html') ||
            (currentPath === 'resume.html' && hrefFile === 'resume.html')) {
            link.classList.add('active');
        }
    });
}
</script>
